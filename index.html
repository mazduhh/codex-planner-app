<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f3">
  <title>My Planner</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="planner-shell">
    <header class="planner-top">
      <span class="brand">My Planner</span>
      <time class="date" id="current-date"></time>
      <button type="button" class="button-primary" id="add-task">+ Add item</button>
    </header>
    <main class="planner-main">
      <section class="today" aria-labelledby="selected-day-title">
        <h1 id="selected-day-title"></h1>
        <p class="sub" id="selected-day-summary"></p>
        <div class="day-tabs" id="day-tabs" role="tablist" aria-label="Today and next two days"></div>
        <section class="task-list" id="selected-day-tasks" role="tabpanel" aria-live="polite"></section>
        <form class="editor" id="task-form" hidden>
          <h2 id="form-heading">Add item</h2>
          <label for="task-title">Title</label>
          <input id="task-title" name="title" required maxlength="120" placeholder="e.g. Finish reading">
          <label for="task-type">Type</label>
          <select id="task-type" name="type"><option value="task">Task</option><option value="assignment">Assignment</option><option value="event">Event or meeting</option></select>
          <label for="task-date">Date <span>(optional)</span></label>
          <input id="task-date" name="date" type="date">
          <div class="time-columns">
            <fieldset><legend>Starts at <span>(optional)</span></legend><div class="time-fields"><select name="startHour" aria-label="Start hour"><option value="">Hour</option></select><select name="startMinute" aria-label="Start minute"><option>00</option><option>15</option><option>30</option><option>45</option></select><select name="startPeriod" aria-label="Start AM or PM"><option>AM</option><option>PM</option></select></div></fieldset>
            <fieldset><legend>Ends at <span>(optional)</span></legend><div class="time-fields"><select name="endHour" aria-label="End hour"><option value="">Hour</option></select><select name="endMinute" aria-label="End minute"><option>00</option><option>15</option><option>30</option><option>45</option></select><select name="endPeriod" aria-label="End AM or PM"><option>AM</option><option>PM</option></select></div></fieldset>
          </div>
          <div class="form-actions"><button class="button-primary" type="submit">Save item</button><button class="button-quiet" id="cancel-edit" type="button">Cancel</button></div>
        </form>
        <p class="status" id="status" aria-live="polite"></p>
      </section>
      <aside class="side" aria-label="Task status">
        <section class="side-section"><h2>Overdue <span class="count" id="overdue-count">0</span></h2><div class="task-list" id="overdue-tasks"></div></section>
        <section class="side-section"><h2>Completed <span class="count" id="completed-count">0</span></h2><div class="task-list" id="completed-tasks"></div></section>
        <section class="side-section"><h2>Later</h2><div class="task-list" id="later-tasks"></div></section>
      </aside>
    </main>
    <section class="week-section" aria-labelledby="week-title">
      <div class="week-heading"><h2 id="week-title">Week</h2><div class="week-controls"><button type="button" class="week-arrow" id="previous-week" aria-label="Previous week">←</button><button type="button" class="week-arrow" id="next-week" aria-label="Next week">→</button></div></div>
      <p class="week-label" id="week-range" aria-live="polite"></p>
      <div class="week-grid" id="week-days"></div>
    </section>
  </div>
</body>
</html>
